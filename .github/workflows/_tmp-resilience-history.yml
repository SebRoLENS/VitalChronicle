name: Resilience load history patch

on:
  push:
    branches: [fix/resilience-load-history]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/resilience-load-history
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply patch
        run: |
          sed -i 's/needle = '\''10\. When confidence/needle = '\''11. When confidence/'\'' scripts/_tmp_patch_resilience_history.py
          sed -i 's/replacement = '\''10\. When confidence/replacement = '\''11. When confidence/'\'' scripts/_tmp_patch_resilience_history.py
          python scripts/_tmp_patch_resilience_history.py
      - name: Validate
        run: |
          python -m ruff check google_health_viewer/agent_tools.py google_health_viewer/agent_runtime.py tests/test_agent_resilience_load_history.py
          python -m pytest -q tests/test_agent_resilience_load_history.py tests/test_agent_localization_overview.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/agent_tools.py google_health_viewer/agent_runtime.py tests/test_agent_resilience_load_history.py
          git commit -m 'Handle insufficient load history in resilience' || exit 0
          git push
