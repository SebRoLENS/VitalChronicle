name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Tag, branch, or commit to build
        required: false
        default: ""

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.21.0"

jobs:
  prepare-icons:
    name: Prepare application icons
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Generate PNG, ICO, and ICNS icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/generate_icons.py
      - uses: actions/upload-artifact@v7
        with:
          name: build-icons
          path: generated-icons/vitalchronicle.*
          if-no-files-found: error

  python-packages:
    name: Python wheel and source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: release-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  linux:
    name: Linux AppImage x86_64
    needs: prepare-icons
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          name: build-icons
          path: generated-icons
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -e ".[dev]"
      - name: Read version
        run: |
          VERSION="$(python -c 'from google_health_viewer import __version__; print(__version__)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build standalone application
        run: |
          python -m PyInstaller \
            --noconfirm --clean --windowed --onedir \
            --name VitalChronicle \
            --icon generated-icons/vitalchronicle.png \
            --add-data "google_health_viewer/assets:google_health_viewer/assets" \
            --collect-all keyring \
            run.py
      - name: Smoke-test frozen GUI
        env:
          QT_QPA_PLATFORM: offscreen
          VITALCHRONICLE_SMOKE_TEST: "1"
        run: dist/VitalChronicle/VitalChronicle
      - name: Build AppImage
        id: appimage
        run: |
          set -euxo pipefail
          mkdir -p VitalChronicle.AppDir/usr/lib/vitalchronicle
          cp -a dist/VitalChronicle/. VitalChronicle.AppDir/usr/lib/vitalchronicle/
          cp packaging/linux/vitalchronicle.desktop VitalChronicle.AppDir/vitalchronicle.desktop
          cp generated-icons/vitalchronicle.png VitalChronicle.AppDir/vitalchronicle.png
          cp generated-icons/vitalchronicle.png VitalChronicle.AppDir/.DirIcon
          cat > VitalChronicle.AppDir/AppRun <<'EOF'
          #!/bin/sh
          APPDIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$APPDIR/usr/lib/vitalchronicle/VitalChronicle" "$@"
          EOF
          chmod +x VitalChronicle.AppDir/AppRun
          APPIMAGE="VitalChronicle-${VERSION}-linux-x86_64.AppImage"
          curl -L --fail --retry 3 \
            -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            ./appimagetool-x86_64.AppImage --no-appstream \
            VitalChronicle.AppDir "$APPIMAGE"
          chmod +x "$APPIMAGE"
          echo "path=$APPIMAGE" >> "$GITHUB_OUTPUT"
      - name: Attest Linux AppImage with Sigstore
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.appimage.outputs.path }}
      - name: Prepare detached Sigstore bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.appimage.outputs.path }}.sigstore.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: |
            ${{ steps.appimage.outputs.path }}
            ${{ steps.appimage.outputs.path }}.sigstore.json
          if-no-files-found: error

  windows:
    name: Windows standalone executable x86_64
    needs: prepare-icons
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          name: build-icons
          path: generated-icons
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Read version
        shell: pwsh
        run: |
          $version = python -c "from google_health_viewer import __version__; print(__version__)"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build standalone executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm --clean --windowed --onefile `
            --name VitalChronicle `
            --icon generated-icons\vitalchronicle.ico `
            --add-data "google_health_viewer/assets;google_health_viewer/assets" `
            --collect-all keyring `
            run.py
          Move-Item dist\VitalChronicle.exe "VitalChronicle-$env:VERSION-windows-x86_64.exe"
      - name: Smoke-test frozen GUI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:VITALCHRONICLE_SMOKE_TEST = "1"
          $process = Start-Process ".\VitalChronicle-$env:VERSION-windows-x86_64.exe" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen GUI exited with $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: VitalChronicle-${{ env.VERSION }}-windows-x86_64.exe
          if-no-files-found: error

  macos:
    name: macOS DMG ${{ matrix.arch }}
    needs: prepare-icons
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          name: build-icons
          path: generated-icons
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Read version
        run: |
          VERSION="$(python -c 'from google_health_viewer import __version__; print(__version__)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build application bundle
        run: |
          python -m PyInstaller \
            --noconfirm --clean --windowed --onedir \
            --name VitalChronicle \
            --icon generated-icons/vitalchronicle.icns \
            --add-data "google_health_viewer/assets:google_health_viewer/assets" \
            --collect-all keyring \
            run.py
      - name: Smoke-test and ad-hoc sign application
        env:
          QT_QPA_PLATFORM: offscreen
          VITALCHRONICLE_SMOKE_TEST: "1"
        run: |
          dist/VitalChronicle.app/Contents/MacOS/VitalChronicle
          codesign --force --deep --sign - dist/VitalChronicle.app
      - name: Create DMG
        run: |
          mkdir dmg-stage
          ditto dist/VitalChronicle.app dmg-stage/VitalChronicle.app
          hdiutil create \
            -volname VitalChronicle \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "VitalChronicle-${VERSION}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: VitalChronicle-${{ env.VERSION }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  source-package:
    name: Source archive and manual
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - name: Read version and package source
        run: |
          VERSION="$(python -c 'from google_health_viewer import __version__; print(__version__)')"
          git archive \
            --format=zip \
            --prefix="VitalChronicle-${VERSION}-source/" \
            --output="VitalChronicle-${VERSION}-source.zip" \
            HEAD
          cp docs/VitalChronicle_User_Manual.pdf "VitalChronicle-${VERSION}-User-Manual.pdf"
          test -s "VitalChronicle-${VERSION}-source.zip"
          test -s "VitalChronicle-${VERSION}-User-Manual.pdf"
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: |
            VitalChronicle-*-source.zip
            VitalChronicle-*-User-Manual.pdf
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(inputs.source_ref, 'v')
    needs: [python-packages, linux, windows, macos, source-package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt
      - name: Publish validated packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.source_ref }}
          name: VitalChronicle ${{ inputs.source_ref }}
          generate_release_notes: true
          body: |
            Private, local-first Google Health dashboard with optional local Ollama analysis.

            VitalChronicle is and will remain free and open source. If it is useful to you,
            development can be supported at https://buymeacoffee.com/sebromi.

            Windows and macOS builds are not signed with paid platform certificates. Verify
            downloaded files with SHA256SUMS.txt. VitalChronicle is not a medical device.
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
