name: Apply dynamic AI catalogue patch

on:
  push:
    branches: [feature/dynamic-ai-model-catalog]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply dynamic AI model catalogue integration'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dynamic-ai-model-catalog
          fetch-depth: 0

      - name: Integrate dynamic catalogue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}: {pattern}")
              file.write_text(result, encoding="utf-8")

          # local_ai.py: use the shared catalogue, expose online discovery in status,
          # and replace the static hard-coded successor map.
          replace_once(
              "google_health_viewer/local_ai.py",
              "from .i18n import _, current_language\n",
              "from .i18n import _, current_language\n"
              "from .ai_model_catalog import (\n"
              "    CURATED_MODEL_DESCRIPTIONS,\n"
              "    CURATED_MODEL_OPTIONS,\n"
              "    discover_model_options,\n"
              "    model_description,\n"
              "    newer_model_suggestion as catalog_newer_model_suggestion,\n"
              "    recommended_model_for_legacy_profile,\n"
              "    remember_installed_models,\n"
              ")\n",
          )
          regex_once(
              "google_health_viewer/local_ai.py",
              r'DEFAULT_MODEL = "qwen3\.5:9b"\nHARDWARE_PROFILE_LABELS = \{.*?\ndef detected_hardware_profile',
              '''DEFAULT_MODEL = recommended_model_for_legacy_profile("gpu16")
          HARDWARE_PROFILE_LABELS = {
              "gpu16": "NVIDIA GPU · 16 GB RAM",
              "cpu32": _("CPU only · 32 GB RAM"),
          }
          MODEL_OPTIONS = CURATED_MODEL_OPTIONS
          MODEL_DESCRIPTIONS = CURATED_MODEL_DESCRIPTIONS


          def recommended_model(profile: str) -> str:
              return recommended_model_for_legacy_profile(profile)


          def newer_model_suggestion(
              model: str, profile: str, catalog_models: tuple[str, ...] = ()
          ) -> str | None:
              return catalog_newer_model_suggestion(
                  model, profile, catalog_models=catalog_models
              )


          def detected_hardware_profile''',
          )
          replace_once(
              "google_health_viewer/local_ai.py",
              "    message: str\n    update_available: bool = False\n",
              "    message: str\n    catalog_models: tuple[str, ...] = ()\n    update_available: bool = False\n",
          )
          replace_once(
              "google_health_viewer/local_ai.py",
              "        installed_item = next(\n            (item for item in model_items if str(item.get(\"name\")) == self.model), None\n        )\n",
              "        remember_installed_models(model_items)\n"
              "        catalog_models = discover_model_options(installed=models)\n\n"
              "        installed_item = next(\n"
              "            (item for item in model_items if str(item.get(\"name\")) == self.model), None\n"
              "        )\n",
          )
          replace_once(
              "google_health_viewer/local_ai.py",
              "        successor = newer_model_suggestion(self.model, self.hardware_profile)\n",
              "        successor = newer_model_suggestion(\n"
              "            self.model, self.hardware_profile, catalog_models\n"
              "        )\n",
          )
          replace_once(
              "google_health_viewer/local_ai.py",
              "            message=message,\n            update_available=bool(update_messages),\n",
              "            message=message,\n"
              "            catalog_models=catalog_models,\n"
              "            update_available=bool(update_messages),\n",
          )

          # ai_hardware.py: preserve detection/benchmark code, but delegate model
          # sizing/ranking to the modern catalogue. Future discovered generations can
          # be adopted from the cache when their size is known.
          replace_once(
              "google_health_viewer/ai_hardware.py",
              "import requests\n",
              "import requests\n\n"
              "from .ai_model_catalog import (\n"
              "    model_memory_gb as catalog_model_memory_gb,\n"
              "    recommended_model_for_hardware,\n"
              ")\n",
          )
          regex_once(
              "google_health_viewer/ai_hardware.py",
              r'def recommend_model\(\n    hardware: HardwareInfo, profile: str = "standard"\n\) -> ModelRecommendation:\n.*?\n\ndef reasoning_value',
              '''def recommend_model(
              hardware: HardwareInfo, profile: str = "standard"
          ) -> ModelRecommendation:
              profile = profile if profile in PERFORMANCE_PROFILES else "standard"
              model = recommended_model_for_hardware(
                  ram_gb=hardware.ram_gb,
                  vram_gb=hardware.vram_gb,
                  has_gpu=hardware.has_gpu,
                  profile=profile,
              )
              if hardware.has_gpu:
                  accelerator = hardware.gpu_name
                  memory_text = (
                      f"{hardware.vram_gb:.1f} GB VRAM"
                      if hardware.vram_gb is not None
                      else "VRAM not reported"
                  )
                  rationale = (
                      f"Sized for {accelerator} ({memory_text}) and {hardware.ram_gb:.0f} GB RAM. "
                      "The catalogue can adopt newer compatible Ollama generations automatically."
                  )
              else:
                  rationale = (
                      f"Sized conservatively for CPU inference and {hardware.ram_gb:.0f} GB RAM. "
                      "The catalogue can adopt newer compatible Ollama generations automatically."
                  )
              return ModelRecommendation(
                  profile=profile,
                  model=model,
                  model_memory_gb=catalog_model_memory_gb(model) or MODEL_MEMORY_GB.get(model),
                  expected_time=_expected_time(hardware, profile),
                  rationale=rationale,
              )


          def reasoning_value''',
          )

          # main_window.py: merge installed + online-discovered models into the editable
          # combo on every background status check, and use dynamic descriptions.
          replace_once(
              "google_health_viewer/main_window.py",
              "    detected_hardware_profile,\n    recommended_model,\n    system_prompt,\n",
              "    detected_hardware_profile,\n"
              "    model_description,\n"
              "    recommended_model,\n"
              "    system_prompt,\n",
          )
          regex_once(
              "google_health_viewer/main_window.py",
              r'    def _update_ai_model_hint\(self, model: str\) -> None:\n        self\.ai_model_hint\.setText\(\n            MODEL_DESCRIPTIONS\.get\(\n                model\.strip\(\),\n                _\("Custom model: check that the name is available in Ollama\."\),\n            \)\n        \)\n',
              '''    def _update_ai_model_hint(self, model: str) -> None:
              self.ai_model_hint.setText(model_description(model))
          ''',
          )
          replace_once(
              "google_health_viewer/main_window.py",
              "        if status.online:\n            self._known_ai_models = set(status.models)\n            installed = self.ai_model_combo.currentText() in status.models\n",
              "        if status.online:\n"
              "            self._known_ai_models = set(status.models)\n"
              "            selected_model = self.ai_model_combo.currentText()\n"
              "            self.ai_model_combo.blockSignals(True)\n"
              "            for candidate in (*status.catalog_models, *status.models):\n"
              "                if not candidate or \"cloud\" in candidate.lower():\n"
              "                    continue\n"
              "                if self.ai_model_combo.findText(candidate) < 0:\n"
              "                    self.ai_model_combo.addItem(candidate)\n"
              "            self.ai_model_combo.setCurrentText(selected_model)\n"
              "            self.ai_model_combo.blockSignals(False)\n"
              "            self._update_ai_model_hint(selected_model)\n"
              "            installed = selected_model in status.models\n",
          )

          # Update hardware tests to reflect the modern recommendation ladder.
          replace_once(
              "tests/test_ai_hardware.py",
              '    assert recommend_model(machine, "max").model == "qwen3:14b"\n',
              '    assert recommend_model(machine, "max").model == "gemma4:12b"\n',
          )
          replace_once(
              "tests/test_ai_hardware.py",
              'def test_cpu_32gb_uses_moe_for_standard_and_larger_moe_for_maximum():\n',
              'def test_cpu_32gb_uses_modern_local_models_for_standard_and_maximum():\n',
          )
          replace_once(
              "tests/test_ai_hardware.py",
              '    assert recommend_model(machine, "fast").model == "qwen3:8b"\n'
              '    assert recommend_model(machine, "standard").model == "qwen3:30b-a3b"\n'
              '    assert recommend_model(machine, "max").model == "qwen3.6:35b-a3b"\n',
              '    assert recommend_model(machine, "fast").model == "qwen3.5:9b"\n'
              '    assert recommend_model(machine, "standard").model == "gemma4:12b"\n'
              '    assert recommend_model(machine, "max").model == "qwen3.8"\n',
          )
          PY

          cat > tests/test_ai_model_catalog.py <<'PY'
          from __future__ import annotations

          from google_health_viewer.ai_model_catalog import (
              CURATED_MODEL_OPTIONS,
              _extract_model_families,
              is_cloud_model,
              newer_model_suggestion,
              recommended_model_for_hardware,
          )


          def test_catalog_includes_current_qwen_gemma_and_open_weight_options():
              assert "qwen3.8" in CURATED_MODEL_OPTIONS
              assert "gemma4:12b" in CURATED_MODEL_OPTIONS
              assert "gpt-oss:20b" in CURATED_MODEL_OPTIONS
              assert not any(is_cloud_model(model) for model in CURATED_MODEL_OPTIONS)


          def test_official_library_parser_accepts_future_generations_and_rejects_cloud():
              html = '''
              <a href="/library/qwen3.8">Qwen 3.8</a>
              <a href="/library/qwen4">Qwen 4</a>
              <a href="/library/gemma5">Gemma 5</a>
              <a href="/library/random-model">Other</a>
              <a href="/library/gemma5-cloud">Cloud</a>
              '''
              models = _extract_model_families(html)
              assert "qwen4" in models
              assert "gemma5" in models
              assert "random-model" not in models
              assert all("cloud" not in model for model in models)


          def test_future_qwen_generation_is_suggested_without_app_update_on_cpu_profile():
              assert newer_model_suggestion(
                  "qwen3.8", "cpu32", catalog_models=("qwen3.8", "qwen4")
              ) == "qwen4"


          def test_modern_hardware_ladder_keeps_small_gpu_conservative():
              assert recommended_model_for_hardware(
                  ram_gb=16, vram_gb=8, has_gpu=True, profile="standard"
              ) == "qwen3.5:9b"
              assert recommended_model_for_hardware(
                  ram_gb=16, vram_gb=8, has_gpu=True, profile="max"
              ) == "gemma4:12b"
          PY

          python -m compileall -q google_health_viewer tests

      - name: Commit integrated patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dynamic-ai-catalog.yml
          git add google_health_viewer/local_ai.py google_health_viewer/ai_hardware.py google_health_viewer/main_window.py tests/test_ai_hardware.py tests/test_ai_model_catalog.py
          git commit -m "Apply dynamic AI model catalogue integration"
          git push origin HEAD:feature/dynamic-ai-model-catalog
