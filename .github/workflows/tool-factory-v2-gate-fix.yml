name: Tool Factory v2 decision gate fix

on:
  push:
    branches:
      - feature/tool-factory-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Harden Tool Factory autonomous decision gate') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/tool-factory-v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch runtime and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('google_health_viewer/agent_runtime_v2.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'MAX_FACTORY_REPAIR_ATTEMPTS = 3\nMAX_TOTAL_MODEL_TURNS = MAX_ANALYSIS_STEPS + MAX_FACTORY_REPAIR_ATTEMPTS + 2\n',
              'MAX_FACTORY_REPAIR_ATTEMPTS = 3\nMAX_RAW_SERIES_PROBES_BEFORE_FACTORY = 2\nMAX_TOTAL_MODEL_TURNS = MAX_ANALYSIS_STEPS + MAX_FACTORY_REPAIR_ATTEMPTS + 4\n',
          )

          text = text.replace(
              '- Tool creation is a means to answer the user\'s question, not an end in itself.\n',
              '- Tool creation is a means to answer the user\'s question, not an end in itself.\n'
              '- When a runtime Tool Factory gate is active, stop raw-series probing and make the capability decision now.\n'
              '- Prefer semantic deterministic tools (for example calculate_cardio_load) over guessing raw metric names.\n',
          )

          needle = '''def _without_factory_creation(schemas: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    result = []\n    for schema in schemas:\n        function = schema.get("function") if isinstance(schema, dict) else None\n        name = str(function.get("name") or "") if isinstance(function, dict) else ""\n        if name != "create_learned_tool":\n            result.append(schema)\n    return result\n\n\n'''
          replacement = needle + '''def _only_named_tools(\n    schemas: list[dict[str, Any]], names: set[str]\n) -> list[dict[str, Any]]:\n    result: list[dict[str, Any]] = []\n    for schema in schemas:\n        function = schema.get("function") if isinstance(schema, dict) else None\n        name = str(function.get("name") or "") if isinstance(function, dict) else ""\n        if name in names:\n            result.append(schema)\n    return result\n\n\ndef _factory_capability(hint: dict[str, Any]) -> str:\n    signals = {str(item) for item in hint.get("signals", [])}\n    parts = ["analysis", "composed"]\n    if "relative personal-baseline threshold" in signals:\n        parts.append("personal_baseline")\n    if "event-conditioned or lagged relationship" in signals:\n        parts.append("temporal_event_response")\n    if "time-to-recovery/return-to-baseline" in signals:\n        parts.append("recovery_latency")\n    if "threshold/frequency analysis" in signals:\n        parts.append("threshold_frequency")\n    return ".".join(parts)\n\n\n'''
          if '_only_named_tools' not in text:
              text = text.replace(needle, replacement)

          old = '''        hint = initial["tool_factory_decision_hint"]\n        if hint.get("consider_reusable_tool"):\n            event(_("Complex reusable transformation detected · checking available capabilities…"))\n        think = performance_profile != "fast"\n'''
          new = '''        hint = initial["tool_factory_decision_hint"]\n        factory_candidate = bool(hint.get("consider_reusable_tool"))\n        factory_capability = _factory_capability(hint)\n        if factory_candidate:\n            event(_("Complex reusable transformation detected · checking available capabilities…"))\n            registry_preflight = self.tools.execute(\n                "search_tool_registry",\n                {"capability": factory_capability, "description": request},\n                thread_id=thread_id,\n            )\n            event(_("Tool Factory preflight: registry checked before raw-data exploration."))\n            messages.append(\n                {\n                    "role": "system",\n                    "content": (\n                        "RUNTIME TOOL FACTORY PREFLIGHT: this request contains a reusable complex "\n                        f"capability pattern ({factory_capability}). Registry result: "\n                        + base_rt._json_text(registry_preflight, 5000)\n                        + ". You may inspect at most two raw metric series before making the "\n                        "capability decision. If no exact existing capability answers the request, "\n                        "create a reusable safe learned tool. Prefer semantic built-ins such as "\n                        "calculate_cardio_load or get_sleep_stage_series over guessing raw metric names."\n                    ),\n                }\n            )\n        think = performance_profile != "fast"\n'''
          if 'Tool Factory preflight: registry checked' not in text:
              text = text.replace(old, new)

          old = '''        analysis_steps = 0\n        factory_repairs = 0\n        total_turns = 0\n        factory_disabled = False\n'''
          new = '''        analysis_steps = 0\n        factory_repairs = 0\n        total_turns = 0\n        factory_disabled = False\n        factory_gate_required = False\n        factory_resolution_seen = False\n        raw_series_probes = 0\n        tool_result_cache: dict[str, dict[str, Any]] = {}\n'''
          text = text.replace(old, new)

          old = '''            active_schemas = _without_factory_creation(schemas) if factory_disabled else schemas\n            message = self._chat_once(\n'''
          new = '''            active_schemas = _without_factory_creation(schemas) if factory_disabled else schemas\n            if factory_gate_required and not factory_disabled:\n                active_schemas = _only_named_tools(active_schemas, {"create_learned_tool"})\n                event(_("Tool Factory gate active · the next decision must resolve the reusable capability gap."))\n            message = self._chat_once(\n'''
          text = text.replace(old, new)

          old = '''                if factory_disabled and name == "create_learned_tool":\n                    result = {\n                        "status": "repair_budget_exhausted",\n                        "error": (\n                            "Tool Factory repair budget is exhausted for this request. Continue with "\n                            "exact existing evidence and state any remaining capability gap."\n                        ),\n                    }\n                else:\n                    try:\n                        result = self.tools.execute(name, args, thread_id=thread_id)\n                    except Exception as exc:  # noqa: BLE001 - tool errors are evidence for the agent.\n                        result = {"error": str(exc), "tool": name}\n                        event(_("Tool {tool} could not complete: {error}", tool=name, error=exc))\n                    else:\n                        productive_tool_call = True\n'''
          new = '''                blocked_for_factory = False\n                if name == "get_metric_series" and factory_candidate and not factory_resolution_seen:\n                    raw_series_probes += 1\n                    if raw_series_probes > MAX_RAW_SERIES_PROBES_BEFORE_FACTORY:\n                        blocked_for_factory = True\n                        factory_gate_required = True\n                        result = {\n                            "status": "factory_decision_required",\n                            "error": (\n                                "Raw-series exploration budget reached for a reusable complex request. "\n                                "The registry preflight is already complete. Create a safe reusable learned "\n                                "tool now instead of probing more raw metric names."\n                            ),\n                            "capability": factory_capability,\n                        }\n                        event(_("Repeated raw-series probing stopped · switching to the Tool Factory decision."))\n\n                cache_key = base_rt._json_text({"tool": name, "arguments": args}, 8000)\n                if not blocked_for_factory and cache_key in tool_result_cache:\n                    result = tool_result_cache[cache_key]\n                    event(_("Repeated identical tool call reused from this analysis instead of consuming another query."))\n                elif not blocked_for_factory and factory_disabled and name == "create_learned_tool":\n                    result = {\n                        "status": "repair_budget_exhausted",\n                        "error": (\n                            "Tool Factory repair budget is exhausted for this request. Continue with "\n                            "exact existing evidence and state any remaining capability gap."\n                        ),\n                    }\n                elif not blocked_for_factory:\n                    try:\n                        result = self.tools.execute(name, args, thread_id=thread_id)\n                    except Exception as exc:  # noqa: BLE001 - tool errors are evidence for the agent.\n                        result = {"error": str(exc), "tool": name}\n                        event(_("Tool {tool} could not complete: {error}", tool=name, error=exc))\n                    else:\n                        productive_tool_call = True\n                        tool_result_cache[cache_key] = result\n'''
          if 'blocked_for_factory = False' not in text:
              text = text.replace(old, new)

          old = '''                    elif status == "reused":\n                        event(\n                            _("Equivalent tool found · reusing it instead of creating a duplicate.")\n                        )\n                        schemas = self.tools.tool_schemas()\n                    elif status == "created":\n                        event(_("Learned tool validated and saved locally."))\n                        schemas = self.tools.tool_schemas()\n'''
          new = '''                    elif status == "reused":\n                        factory_resolution_seen = True\n                        factory_gate_required = False\n                        event(\n                            _("Equivalent tool found · reusing it instead of creating a duplicate.")\n                        )\n                        schemas = self.tools.tool_schemas()\n                    elif status == "created":\n                        factory_resolution_seen = True\n                        factory_gate_required = False\n                        event(_("Learned tool validated and saved locally."))\n                        schemas = self.tools.tool_schemas()\n'''
          text = text.replace(old, new)

          old = '''            if not repair_turn or productive_tool_call:\n                analysis_steps += 1\n            elif factory_repairs < MAX_FACTORY_REPAIR_ATTEMPTS:\n                event(\n                    _("Repairing the learned-tool definition without consuming an analysis step…")\n                )\n\n            if analysis_steps >= MAX_ANALYSIS_STEPS - 1:\n'''
          new = '''            if not repair_turn or productive_tool_call:\n                analysis_steps += 1\n            elif factory_repairs < MAX_FACTORY_REPAIR_ATTEMPTS:\n                event(\n                    _("Repairing the learned-tool definition without consuming an analysis step…")\n                )\n\n            if (\n                factory_candidate\n                and not factory_resolution_seen\n                and not factory_disabled\n                and analysis_steps >= 4\n            ):\n                factory_gate_required = True\n\n            if analysis_steps >= MAX_ANALYSIS_STEPS - 1:\n'''
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_agent_tool_factory_v2.py')
          t = tests.read_text(encoding='utf-8')
          if 'class FactoryGateRuntime' not in t:
              t += '''\n\nclass FactoryGateRuntime(AgentRuntime):\n    def __init__(self, health_store, agent_store):\n        super().__init__(health_store, agent_store)\n        self.turn = 0\n        self.available_by_turn: list[set[str]] = []\n\n    def _chat_once(self, **kwargs):\n        self.turn += 1\n        names = {\n            str(item.get("function", {}).get("name") or "")\n            for item in kwargs.get("tools", [])\n            if isinstance(item, dict)\n        }\n        self.available_by_turn.append(names)\n        if self.turn <= 3:\n            return {\n                "content": "",\n                "tool_calls": [\n                    {\n                        "function": {\n                            "name": "get_metric_series",\n                            "arguments": {"metric": f"guessed-metric-{self.turn}"},\n                        }\n                    }\n                ],\n            }\n        if self.turn == 4:\n            return {\n                "content": "",\n                "tool_calls": [\n                    {\n                        "function": {\n                            "name": "create_learned_tool",\n                            "arguments": {\n                                "name": "forced_factory_tool",\n                                "description": "Reusable threshold and temporal analysis",\n                                "capability": "analysis.composed.personal_baseline_temporal_event_response",\n                                "pipeline": [{"op": "return"}],\n                            },\n                        }\n                    }\n                ],\n            }\n        return {"content": "Risposta finale dopo la decisione della Tool Factory."}\n\n\ndef test_complex_query_stops_repeated_raw_metric_probing_and_forces_factory(tmp_path):\n    store = AgentStore(tmp_path / "agent.sqlite3")\n    runtime = FactoryGateRuntime(DummyHealthStore(tmp_path / "health.sqlite3"), store)\n    events: list[str] = []\n\n    answer = runtime.analyze(\n        model="test",\n        snapshot={},\n        question=(\n            "Quando il carico supera del 20% la baseline personale, il sonno profondo della notte "\n            "successiva diminuisce e dopo quanti giorni torna al livello abituale?"\n        ),\n        history=[],\n        max_tokens=1024,\n        model_context_limit=None,\n        performance_profile="standard",\n        thread_id="gate-thread",\n        event_callback=events.append,\n    )\n\n    assert answer.startswith("Risposta finale")\n    assert runtime.turn == 5\n    assert "get_metric_series" not in runtime.available_by_turn[3]\n    assert runtime.available_by_turn[3] == {"create_learned_tool"}\n    assert any("raw-series probing stopped" in event.lower() for event in events)\n    assert any("registry checked" in event.lower() for event in events)\n'''
              tests.write_text(t, encoding='utf-8')
          PY

          python scripts/update_translations.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('google_health_viewer/locales/it.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          values = {
              'Tool Factory preflight: registry checked before raw-data exploration.': 'Preflight Tool Factory: registry controllato prima di esplorare i dati grezzi.',
              'Tool Factory gate active · the next decision must resolve the reusable capability gap.': 'Gate Tool Factory attivo · la prossima decisione deve risolvere il capability gap riutilizzabile.',
              'Repeated raw-series probing stopped · switching to the Tool Factory decision.': 'Interrotta la ricerca ripetuta di serie grezze · passo alla decisione della Tool Factory.',
              'Repeated identical tool call reused from this analysis instead of consuming another query.': 'Chiamata identica riutilizzata da questa analisi invece di consumare un’altra interrogazione.',
          }
          for key, value in values.items():
              if key in data:
                  data[key] = value
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          python -m ruff check google_health_viewer/agent_runtime_v2.py tests/test_agent_tool_factory_v2.py
          pytest -q tests/test_agent_tool_factory_v2.py

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/agent_runtime_v2.py tests/test_agent_tool_factory_v2.py google_health_viewer/locales/en.json google_health_viewer/locales/it.json
          git commit -m 'Harden Tool Factory autonomous decision gate'
          git push origin HEAD:feature/tool-factory-v2
