name: Temporary catalogue refresh

on:
  push:
    branches:
      - feature/coherent-ai-model-selector

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/coherent-ai-model-selector
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh catalogues
        run: python scripts/update_translations.py
      - name: Commit generated catalogues
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/locales/en.json google_health_viewer/locales/it.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(l10n): refresh AI selector strings'
            git push origin HEAD:feature/coherent-ai-model-selector
          fi
