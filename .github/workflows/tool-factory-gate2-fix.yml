name: Tool Factory gate enforcement fix

on:
  push:
    branches:
      - fix/tool-factory-decision-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Enforce Tool Factory gate and semantic routing') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/tool-factory-decision-gate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Apply and validate patch
        run: |
          python scripts/_tmp_patch_tool_factory_gate2.py
          python scripts/update_translations.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('google_health_viewer/locales/it.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          translations = {
              'Direct answer blocked by Tool Factory gate · the reusable capability must be resolved first.': 'Risposta diretta bloccata dal gate Tool Factory · prima deve essere risolto il capability gap riutilizzabile.',
              'Tool Factory gate attempt limit reached · finalising without inventing missing data.': 'Raggiunto il limite di tentativi del gate Tool Factory · finalizzo senza inventare dati mancanti.',
              'Tool name rejected as a raw metric identifier: {metric}': 'Nome di tool rifiutato come identificatore di metrica grezza: {metric}',
          }
          for key, value in translations.items():
              if key in data:
                  data[key] = value
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m ruff check google_health_viewer/agent_runtime_v2.py tests/test_agent_tool_factory_v2.py
          pytest -q tests/test_agent_tool_factory_v2.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/agent_runtime_v2.py tests/test_agent_tool_factory_v2.py google_health_viewer/locales/en.json google_health_viewer/locales/it.json
          git commit -m 'Enforce Tool Factory gate and semantic routing'
          git push origin HEAD:fix/tool-factory-decision-gate
