name: One-time version metadata alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-version-metadata.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Align version metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          for relative in (
              'README.md',
              'docs/manual.md',
              'docs/quick-start.md',
              'docs/releasing.md',
          ):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('1.2.0', '1.2.1'), encoding='utf-8')

          citation = Path('CITATION.cff')
          text = citation.read_text(encoding='utf-8')
          text = text.replace('\nversion: 1.2.0\n', '\nversion: 1.2.1\n')
          text = text.replace('\ndate-released: 2026-09-02\n', '\ndate-released: 2026-09-03\n')
          citation.write_text(text, encoding='utf-8')
          PY
      - name: Commit aligned metadata and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-version-metadata.yml
          git add README.md docs/manual.md docs/quick-start.md docs/releasing.md CITATION.cff
          git commit -m 'chore: align VitalChronicle 1.2.1 metadata'
          git push origin HEAD:main
