name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Compile and validate metadata
        run: |
          python -m compileall -q google_health_viewer scripts
          python scripts/validate_project.py

  screenshot-smoke:
    name: Real GUI screenshot smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Render real interface from synthetic data
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/generate_screenshots.py --output "${{ runner.temp }}/screenshots"
          test -s "${{ runner.temp }}/screenshots/overview.png"
          test -s "${{ runner.temp }}/screenshots/data-explorer.png"
          test -s "${{ runner.temp }}/screenshots/ai-control-center.png"
          test -s "${{ runner.temp }}/screenshots/ai-deterministic-metrics.png"
          test -s "${{ runner.temp }}/screenshots/local-ai.png"
          test -s "${{ runner.temp }}/screenshots/ai-settings.png"
          test -s "${{ runner.temp }}/screenshots/ai-prompt.png"
