name: Apply installed model highlight

on:
  push:
    branches:
      - feature/highlight-installed-ollama-models

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/highlight-installed-ollama-models
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_installed_model_highlight.py
      - name: Syntax check
        run: python -m compileall -q google_health_viewer/main_window.py
      - name: Ruff check
        run: |
          python -m pip install -q ruff
          ruff check google_health_viewer/main_window.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google_health_viewer/main_window.py
          git commit -m "Highlight installed Ollama models in selector"
          git rm .github/scripts/patch_installed_model_highlight.py
          git rm .github/workflows/apply-installed-model-highlight.yml
          git rm .github/workflows/patch-highlight-installed-models.yml
          git commit -m "Remove temporary patch tooling"
          git push origin HEAD:feature/highlight-installed-ollama-models
