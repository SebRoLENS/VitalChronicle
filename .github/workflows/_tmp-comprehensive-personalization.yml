name: Comprehensive personalization patch

on:
  push:
    branches: [feature/agent-live-telemetry]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/agent-live-telemetry
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply patch
        run: python scripts/_tmp_patch_comprehensive_personalization.py
      - name: Validate
        run: |
          ruff check google_health_viewer/agent_runtime.py google_health_viewer/agent_runtime_v2.py tests/test_agent_tool_factory_v2.py
          pytest -q tests/test_agent_tool_factory_v2.py tests/test_agent_self_reports_temporal.py
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/agent_runtime.py google_health_viewer/agent_runtime_v2.py tests/test_agent_tool_factory_v2.py
          git commit -m 'Personalize comprehensive health analysis from current context' || exit 0
          git push
