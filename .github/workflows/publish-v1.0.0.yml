name: Publish VitalChronicle 1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Move the unpublished release tag to the corrected commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force v1.0.0 "$GITHUB_SHA"
          git push --force origin refs/tags/v1.0.0
      - name: Dispatch corrected native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-desktop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref=v1.0.0
