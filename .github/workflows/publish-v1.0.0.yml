name: Publish VitalChronicle 1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch corrected native build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-desktop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref=v1.0.0
