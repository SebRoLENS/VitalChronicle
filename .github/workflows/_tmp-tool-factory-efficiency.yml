name: Tool Factory efficiency patch

on:
  push:
    branches:
      - fix/tool-factory-repair-efficiency

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Tool Factory repair exhaustion and deterministic fallback') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/tool-factory-repair-efficiency
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Apply patch
        run: |
          python scripts/_tmp_patch_tool_factory_efficiency.py
          python scripts/update_translations.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('google_health_viewer/locales/it.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          key = 'Agent runtime blocked a tool call unavailable in this turn: {tools}'
          if key in data:
              data[key] = 'Il runtime dell’agente ha bloccato una chiamata a un tool non disponibile in questo turno: {tools}'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m ruff format \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_tool_factory.py \
            tests/test_agent_tool_factory_v2.py
          python -m ruff check --fix \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_tool_factory.py \
            tests/test_agent_tool_factory_v2.py
      - name: Validate focused tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_tool_factory.py \
            tests/test_agent_tool_factory_v2.py
          pytest -q tests/test_agent_tool_factory_v2.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/locales/en.json \
            google_health_viewer/locales/it.json \
            tests/test_agent_tool_factory_v2.py
          git commit -m 'Fix Tool Factory repair exhaustion and deterministic fallback'
          git push origin HEAD:fix/tool-factory-repair-efficiency
