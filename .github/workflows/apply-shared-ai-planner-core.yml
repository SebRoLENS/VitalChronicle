name: Apply shared AI planner core

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-shared-ai-planner-core.py
      - .github/workflows/apply-shared-ai-planner-core.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Extract platform-neutral planner core
        run: python scripts/apply-shared-ai-planner-core.py
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'refactor: share AI-first query planner core across platforms'
            git push
          fi
