name: Tool Factory strict gate fix

on:
  push:
    branches:
      - fix/tool-factory-strict-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Enforce advertised Tool Factory tools at runtime') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/tool-factory-strict-gate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Apply and validate patch
        run: |
          python scripts/_tmp_patch_strict_factory_gate.py
          python scripts/update_translations.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('google_health_viewer/locales/it.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          translations = {
              'Tool Factory gate blocked an out-of-scope tool call: {tools}': 'Il gate Tool Factory ha bloccato una chiamata a un tool fuori ambito: {tools}',
              'Tool Factory gate attempt limit reached · finalising without executing out-of-scope tools.': 'Raggiunto il limite di tentativi del gate Tool Factory · finalizzo senza eseguire tool fuori ambito.',
          }
          for key, value in translations.items():
              if key in data:
                  data[key] = value
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m ruff check google_health_viewer/agent_runtime_v2.py tests/test_agent_tool_factory_v2.py
          pytest -q tests/test_agent_tool_factory_v2.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/agent_runtime_v2.py tests/test_agent_tool_factory_v2.py google_health_viewer/locales/en.json google_health_viewer/locales/it.json
          git commit -m 'Enforce advertised Tool Factory tools at runtime'
          git push origin HEAD:fix/tool-factory-strict-gate
