name: Fix dynamic AI catalogue tests

on:
  push:
    branches: [feature/dynamic-ai-model-catalog]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix dynamic catalogue offline fallback'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dynamic-ai-model-catalog
          fetch-depth: 0

      - name: Preserve offline upgrade suggestions and update regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('google_health_viewer/ai_model_catalog.py')
          text = path.read_text(encoding='utf-8')
          old = '    candidates = tuple(catalog_models) or discover_model_families()\n'
          new = '    candidates = tuple(catalog_models) or CURATED_MODEL_OPTIONS\n'
          if old not in text:
              raise SystemExit('catalog fallback line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/test_local_ai.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert recommended_model("cpu32") == "qwen3:30b-a3b"\n',
              '    assert recommended_model("cpu32") == "qwen3.8"\n',
              1,
          )
          text = text.replace(
              '    assert newer_model_suggestion("qwen3:30b-a3b", "cpu32") == "qwen3.6:35b-a3b"\n',
              '    assert newer_model_suggestion("qwen3:30b-a3b", "cpu32") == "qwen3.8"\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q google_health_viewer tests

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-dynamic-ai-catalog-tests.yml
          git add google_health_viewer/ai_model_catalog.py tests/test_local_ai.py
          git commit -m "Fix dynamic catalogue offline fallback"
          git push origin HEAD:feature/dynamic-ai-model-catalog
