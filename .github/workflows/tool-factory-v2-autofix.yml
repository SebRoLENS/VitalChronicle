name: Tool Factory v2 autofix

on:
  push:
    branches:
      - feature/tool-factory-v2

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/tool-factory-v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply non-autofixable Ruff corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          factory = Path('google_health_viewer/agent_tool_factory.py')
          text = factory.read_text(encoding='utf-8')
          text = text.replace(
              '            if not isinstance(raw_step, dict):\n'
              '                raise ValueError(f"Pipeline step {step_number} must be an object")\n',
              '            if not isinstance(raw_step, dict):\n'
              '                raise TypeError(f"Pipeline step {step_number} must be an object")\n',
          )
          text = text.replace(
              '            def require_alias(field: str) -> None:\n'
              '                ref = str(step.get(field) or "")\n'
              '                if ref and ref not in aliases:\n'
              '                    raise ValueError(\n'
              '                        f"Step {step_number} references unknown earlier result \'{ref}\' in {field}."\n'
              '                    )\n',
              '            def require_alias(\n'
              '                field: str,\n'
              '                current_step: dict[str, Any] = step,\n'
              '                current_number: int = step_number,\n'
              '            ) -> None:\n'
              '                ref = str(current_step.get(field) or "")\n'
              '                if ref and ref not in aliases:\n'
              '                    raise ValueError(\n'
              '                        f"Step {current_number} references unknown earlier result \'{ref}\' in {field}."\n'
              '                    )\n',
          )
          factory.write_text(text, encoding='utf-8')
          PY
      - name: Ruff autofix and formatting
        run: |
          python -m pip install 'ruff>=0.16.6'
          ruff check google_health_viewer/agent_runtime_v2.py google_health_viewer/agent_tool_factory.py --fix
          ruff format google_health_viewer/agent_runtime_v2.py google_health_viewer/agent_tool_factory.py
          ruff check google_health_viewer/agent_runtime_v2.py google_health_viewer/agent_tool_factory.py
      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/agent_runtime_v2.py google_health_viewer/agent_tool_factory.py
          git commit -m 'Fix Tool Factory v2 lint'
          git push origin HEAD:feature/tool-factory-v2
