name: Translation catalogues

on:
  push:
    branches:
      - main
    paths:
      - 'google_health_viewer/**/*.py'
      - 'google_health_viewer/locales/**'
      - 'scripts/update_translations.py'
      - 'tests/test_i18n.py'
      - '.github/workflows/translations.yml'
  pull_request:
    paths:
      - 'google_health_viewer/**/*.py'
      - 'google_health_viewer/locales/**'
      - 'scripts/update_translations.py'
      - 'tests/test_i18n.py'
      - '.github/workflows/translations.yml'
  workflow_dispatch:

# Weblate itself now handles repository updates and outbound translation
# delivery through the Hosted Weblate GitHub App. This workflow only keeps
# the source catalogues generated from the application code in sync and
# validates translation changes proposed through pull requests.
permissions:
  contents: read

concurrency:
  group: translation-catalogues-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate source catalogues and i18n
        run: |
          python scripts/update_translations.py
          git diff --exit-code -- google_health_viewer/locales/en.json google_health_viewer/locales/it.json
          pytest -q tests/test_i18n.py

  refresh-source-catalogues:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh source catalogues
        run: python scripts/update_translations.py
      - name: Commit refreshed catalogues when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/locales/en.json google_health_viewer/locales/it.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(l10n): refresh source catalogues'
            git push origin HEAD:main
          fi
