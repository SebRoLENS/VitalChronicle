name: Translation validation

on:
  push:
    paths:
      - 'google_health_viewer/locales/**'
      - 'google_health_viewer/i18n.py'
      - 'scripts/update_translations.py'
      - 'tests/test_i18n.py'
  pull_request:
    paths:
      - 'google_health_viewer/locales/**'
      - 'google_health_viewer/i18n.py'
      - 'scripts/update_translations.py'
      - 'tests/test_i18n.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate translation catalogues
        run: |
          python scripts/update_translations.py
          git diff --exit-code -- google_health_viewer/locales
          pytest -q tests/test_i18n.py
