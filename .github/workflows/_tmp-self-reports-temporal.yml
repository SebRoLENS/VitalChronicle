name: Self-report temporal patch

on:
  push:
    branches:
      - feature/self-reports-temporal-context

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add dated self-reports and temporal personal context') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/self-reports-temporal-context
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Apply patch
        run: |
          python scripts/_tmp_patch_self_reports_temporal.py
          python scripts/update_translations.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('google_health_viewer/locales/it.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          translations = {
              'Subjective self-report saved locally as a dated event.': 'Auto-segnalazione soggettiva salvata localmente come evento datato.',
              'One targeted follow-up was queued to improve future personalisation.': 'È stata preparata una sola domanda mirata per migliorare la personalizzazione futura.',
              "Is today's tiredness mainly muscular fatigue, sleepiness, or a more general lack of energy?": 'La stanchezza di oggi è soprattutto muscolare, sonnolenza oppure una mancanza di energia più generale?',
              'This helps distinguish training-related fatigue from sleepiness or more general low energy in future personal analyses.': 'Questo aiuta a distinguere in futuro la fatica legata all’allenamento dalla sonnolenza o da una riduzione più generale dell’energia.',
              'Would you describe the sleepiness as mild, moderate, or strong, and is it unusual for this time of day?': 'Descriveresti la sonnolenza come lieve, moderata o forte, ed è insolita per quest’ora del giorno?',
              'This adds useful subjective context to sleep and recovery measurements without turning it into a diagnosis.': 'Aggiunge un contesto soggettivo utile alle misure di sonno e recupero senza trasformarlo in una diagnosi.',
              'Is the soreness mainly in muscles you trained recently, and would you call it mild, moderate, or strong?': 'L’indolenzimento riguarda soprattutto muscoli allenati di recente, e lo definiresti lieve, moderato o forte?',
              'This helps relate future subjective recovery reports to recent training without treating soreness as a medical diagnosis.': 'Aiuta a collegare future segnalazioni soggettive di recupero all’allenamento recente senza trattare l’indolenzimento come diagnosi medica.',
              "Does today's stress feel mainly mental, physical, or mixed?": 'Lo stress di oggi ti sembra soprattutto mentale, fisico o misto?',
              'This helps keep subjective stress context separate from wearable-derived physiological strain.': 'Aiuta a mantenere distinto il contesto soggettivo dello stress dallo strain fisiologico derivato dal wearable.',
              'Is this feeling unusual for you today, and would you rate it as mild, moderate, or strong?': 'Questa sensazione è insolita per te oggi, e la valuteresti lieve, moderata o forte?',
              'One concise detail can make future personal interpretation more specific without creating a stable trait from one report.': 'Un dettaglio conciso può rendere più specifiche le interpretazioni future senza creare un tratto stabile da una singola segnalazione.',
              'Temporal scope': 'Ambito temporale',
              'Valid until': 'Valido fino a',
              'Freshness': 'Attualità',
              'Current': 'Attuale',
              'current': 'attuale',
              'expired': 'scaduto',
              'Recent self-reports': 'Auto-segnalazioni recenti',
              'Dated subjective observations are kept separate from learned associations. One report does not become a stable trait.': 'Le osservazioni soggettive datate restano separate dalle associazioni apprese. Una singola segnalazione non diventa un tratto stabile.',
              'When': 'Quando',
              'Self-report': 'Auto-segnalazione',
              'Category': 'Categoria',
              'Follow-up detail': 'Dettaglio di approfondimento',
              'Intensity': 'Intensità',
              'Self-report details': 'Dettagli auto-segnalazione',
          }
          for key, value in translations.items():
              if key in data:
                  data[key] = value
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m ruff format \
            google_health_viewer/agent_store.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_runtime.py \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_ui.py \
            tests/test_agent_self_reports_temporal.py
          python -m ruff check --fix \
            google_health_viewer/agent_store.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_runtime.py \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_ui.py \
            tests/test_agent_self_reports_temporal.py
      - name: Validate focused tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check \
            google_health_viewer/agent_store.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_runtime.py \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_ui.py \
            tests/test_agent_self_reports_temporal.py
          pytest -q \
            tests/test_agent_self_reports_temporal.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_agent_ui_details.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            google_health_viewer/agent_store.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_runtime.py \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_ui.py \
            google_health_viewer/locales/en.json \
            google_health_viewer/locales/it.json \
            docs/personal-health-agent.md \
            tests/test_agent_self_reports_temporal.py
          git commit -m 'Add dated self-reports and temporal personal context'
          git push origin HEAD:feature/self-reports-temporal-context
