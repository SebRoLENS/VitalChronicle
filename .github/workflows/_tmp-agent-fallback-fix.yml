name: Agent fallback fix

on:
  push:
    branches: [feature/agent-live-telemetry]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/agent-live-telemetry
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply fix and refresh catalogues
        run: |
          python scripts/_tmp_fix_agent_fallback.py
          python scripts/update_translations.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('google_health_viewer/locales/it.json')
          d=json.loads(p.read_text())
          d['Agent exchange']='Scambio agente'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2, sort_keys=True)+'\n')
          PY
      - name: Validate
        run: |
          ruff check google_health_viewer/agent_runtime.py tests/test_agent_tool_factory_v2.py
          pytest -q tests/test_agent_tool_factory_v2.py tests/test_i18n.py
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/agent_runtime.py google_health_viewer/locales/en.json google_health_viewer/locales/it.json tests/test_agent_tool_factory_v2.py
          git commit -m 'Avoid false tool-calling fallback and expose agent telemetry' || exit 0
          git push
