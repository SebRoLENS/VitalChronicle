name: Desktop heart-rate rollup patch

on:
  push:
    branches: [fix/desktop-heart-rate-five-minute-storage]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/desktop-heart-rate-five-minute-storage
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Apply storage patch
        run: python scripts/_tmp_patch_desktop_hr_rollup.py
      - name: Validate ingestion and persistence
        run: |
          ruff check google_health_viewer/api.py google_health_viewer/constants.py google_health_viewer/heart_rate_core.py google_health_viewer/storage.py google_health_viewer/workers.py tests/test_api.py tests/test_storage.py tests/test_heart_rate_five_minute_core.py
          pytest -q tests/test_api.py tests/test_storage.py tests/test_heart_rate_five_minute_core.py
      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google_health_viewer/api.py google_health_viewer/constants.py google_health_viewer/heart_rate_core.py google_health_viewer/storage.py google_health_viewer/workers.py tests/test_api.py tests/test_storage.py .github/workflows/heart-rate-core.yml
          git commit -m 'Store desktop heart rate as five-minute rollups' || exit 0
          git push
