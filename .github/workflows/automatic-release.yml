name: Automatic release

on:
  push:
    branches: [main]
    paths:
      - 'google_health_viewer/**'
      - 'tests/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'run.py'
      - '.release-trigger'

permissions:
  contents: write
  actions: write

concurrency:
  group: vitalchronicle-automatic-release
  cancel-in-progress: false

jobs:
  release-guard:
    runs-on: ubuntu-22.04
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Ignore duplicate delivery of an already released commit
        id: guard
        run: |
          LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -n "$LATEST_TAG" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$LATEST_TAG"; then
            echo "Commit $GITHUB_SHA is already included in $LATEST_TAG; skipping duplicate release."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-release:
    needs: release-guard
    if: github.actor != 'github-actions[bot]' && needs.release-guard.outputs.should_run == 'true'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation and document toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-dejavu-core libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            pandoc poppler-utils texlive-fonts-recommended texlive-latex-extra texlive-xetex
          python -m pip install -e ".[dev]"

      - name: Prepare semantic version
        id: prepare
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          BUMP=patch
          if grep -qi '\[major\]' <<< "$RELEASE_COMMIT_MESSAGE"; then
            BUMP=major
          elif grep -qi '\[minor\]' <<< "$RELEASE_COMMIT_MESSAGE"; then
            BUMP=minor
          fi
          VERSION="$(VITAL_RELEASE_BUMP="$BUMP" python scripts/prepare_release.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing VitalChronicle v$VERSION ($BUMP)"

      - name: Refresh real GUI screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/generate_screenshots.py

      - name: Build detailed PDF manual
        run: |
          pandoc docs/manual.md \
            --from gfm \
            --resource-path=.:docs \
            --pdf-engine=xelatex \
            --output docs/VitalChronicle_User_Manual.pdf
          test -s docs/VitalChronicle_User_Manual.pdf
          pdfinfo docs/VitalChronicle_User_Manual.pdf | grep -q '^Pages:'

      - name: Validate prepared release
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check .
          pytest -q
          python -m compileall -q google_health_viewer scripts
          python scripts/validate_project.py
          python -m build
          git diff --check

      - name: Commit prepared release
        id: commit
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            google_health_viewer/__init__.py pyproject.toml README.md CHANGELOG.md \
            CITATION.cff docs
          if ! git diff --cached --quiet; then
            git commit -m "Prepare VitalChronicle v${VERSION} release"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; refusing to overwrite it."
            exit 1
          fi
          git tag "v${VERSION}" "${{ steps.commit.outputs.commit_sha }}"
          git push origin "v${VERSION}"

      - name: Dispatch native package builds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          gh workflow run build-desktop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_ref=v${VERSION}"
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/build-desktop.yml/runs?event=workflow_dispatch&per_page=20" \
                --jq ".workflow_runs[] | select(.head_sha == \"${RELEASE_SHA}\") | .id" \
                | head -n 1
            )"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 4
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not locate the desktop build workflow run."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status