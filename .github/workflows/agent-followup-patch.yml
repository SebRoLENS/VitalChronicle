name: Agent follow-up patch

on:
  push:
    branches:
      - fix/tool-factory-strict-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Improve agent tool creation UX and sleep-stage routing') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/tool-factory-strict-gate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Apply patch
        run: |
          python scripts/_tmp_fix_agent_followup_generator.py
          python scripts/_tmp_patch_agent_followup.py
          python - <<'PY'
          from pathlib import Path

          path = Path('google_health_viewer/deterministic_context_patch.py')
          text = path.read_text(encoding='utf-8')
          old_normalize = '''def _normalize_stage(value: Any) -> str:
              text = str(value or "UNKNOWN").strip().upper().replace("-", "_").replace(" ", "_")
              for stage in _KNOWN_STAGES:
                  if text == stage or text.endswith(f"_{stage}"):
                      return stage
              return text or "UNKNOWN"
          '''
          new_normalize = '''def _normalize_stage(value: Any) -> str:
              if value is None or isinstance(value, bool):
                  return "UNKNOWN"
              try:
                  numeric = float(value)
              except (TypeError, ValueError):
                  numeric = None
              if numeric is not None and math.isfinite(numeric) and numeric.is_integer():
                  health_connect_stages = {
                      0: "UNKNOWN",
                      1: "AWAKE",
                      2: "SLEEPING",
                      3: "OUT_OF_BED",
                      4: "LIGHT",
                      5: "DEEP",
                      6: "REM",
                      7: "AWAKE_IN_BED",
                  }
                  mapped = health_connect_stages.get(int(numeric))
                  if mapped:
                      return mapped
              text = str(value).strip().upper().replace("-", "_").replace(" ", "_")
              for stage in _KNOWN_STAGES:
                  if text == stage or text.endswith(f"_{stage}"):
                      return stage
              return text or "UNKNOWN"
          '''
          old_intervals = '''        intervals.append((start, end, _normalize_stage(entry.get("type"))))
          '''
          new_intervals = '''        stage_value = entry.get("type")
              if stage_value is None:
                  stage_value = entry.get("stage")
              if stage_value is None:
                  stage_value = entry.get("stageType")
              intervals.append((start, end, _normalize_stage(stage_value)))
          '''
          if old_normalize not in text:
              raise SystemExit('active sleep-stage normalization marker not found')
          if old_intervals not in text:
              raise SystemExit('active sleep-stage interval marker not found')
          text = text.replace(old_normalize, new_normalize, 1)
          text = text.replace(old_intervals, new_intervals, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/update_translations.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('google_health_viewer/locales/it.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          translations = {
              "The AI is creating a custom tool; this may take longer than usual.": "L'AI sta creando un tool personalizzato; potrebbe richiedere più tempo del solito.",
              "Name": "Nome",
              "Version": "Versione",
              "Last used": "Ultimo utilizzo",
              "Description": "Descrizione",
              "Parameters": "Parametri",
              "Outputs": "Output",
              "Dependencies": "Dipendenze",
              "Pipeline": "Pipeline",
              "Created": "Creato",
              "Updated": "Aggiornato",
              "Key": "Chiave",
              "Learned association": "Associazione appresa",
              "Evidence details": "Dettagli delle evidenze",
              "View selected tool details…": "Mostra dettagli del tool selezionato…",
              "View selected association details…": "Mostra dettagli dell'associazione selezionata…",
              "Tool details · {name}": "Dettagli tool · {name}",
              "Learned association details": "Dettagli dell'associazione appresa",
          }
          for key, value in translations.items():
              if key in data:
                  data[key] = value
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m ruff format \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_integration.py \
            google_health_viewer/ai_chat.py \
            google_health_viewer/analysis.py \
            google_health_viewer/deterministic_context_patch.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_ui.py \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
          python -m ruff check --fix \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_integration.py \
            google_health_viewer/ai_chat.py \
            google_health_viewer/analysis.py \
            google_health_viewer/deterministic_context_patch.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_ui.py \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
      - name: Validate focused tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import inspect
          from google_health_viewer import analysis
          from google_health_viewer import deterministic_context_patch as patch

          record = {
              "start_time": "2026-08-01T22:00:00+00:00",
              "end_time": "2026-08-02T06:00:00+00:00",
              "payload": {"sleep": {"stages": [
                  {"stage": 4, "startTime": "2026-08-01T22:00:00+00:00", "endTime": "2026-08-01T23:00:00+00:00"},
                  {"stage": 5, "startTime": "2026-08-01T23:00:00+00:00", "endTime": "2026-08-02T00:30:00+00:00"},
                  {"stageType": 6, "startTime": "2026-08-02T00:30:00+00:00", "endTime": "2026-08-02T02:00:00+00:00"},
              ]}},
          }
          print("PATCH_FILE", patch.__file__)
          print("NORM", patch._normalize_stage(4), patch._normalize_stage(5), patch._normalize_stage(6))
          print("INTERVALS", patch._stage_intervals(record, analysis))
          print("PATCH_TOTALS", patch._sleep_stage_totals(record, analysis))
          print("INSTALLED", analysis.sleep_stage_points([record]))
          print(inspect.getsource(patch._intervals_from_entries))
          PY
          python -m ruff check \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_integration.py \
            google_health_viewer/ai_chat.py \
            google_health_viewer/analysis.py \
            google_health_viewer/deterministic_context_patch.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_ui.py \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
          pytest -q \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
          python scripts/check_translations.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_integration.py \
            google_health_viewer/ai_chat.py \
            google_health_viewer/analysis.py \
            google_health_viewer/deterministic_context_patch.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_ui.py \
            google_health_viewer/locales/en.json \
            google_health_viewer/locales/it.json \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
          git commit -m 'Improve agent tool creation UX and sleep-stage routing'
          git push origin HEAD:fix/tool-factory-strict-gate
