name: Agent follow-up patch

on:
  push:
    branches:
      - fix/tool-factory-strict-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Improve agent tool creation UX and sleep-stage routing') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/tool-factory-strict-gate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Apply patch
        run: |
          python scripts/_tmp_fix_agent_followup_generator.py
          python scripts/_tmp_patch_agent_followup.py
          python scripts/_tmp_patch_sleep_stage_runtime.py
          python scripts/update_translations.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('google_health_viewer/locales/it.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          translations = {
              "The AI is creating a custom tool; this may take longer than usual.": "L'AI sta creando un tool personalizzato; potrebbe richiedere più tempo del solito.",
              "Name": "Nome",
              "Version": "Versione",
              "Last used": "Ultimo utilizzo",
              "Description": "Descrizione",
              "Parameters": "Parametri",
              "Outputs": "Output",
              "Dependencies": "Dipendenze",
              "Pipeline": "Pipeline",
              "Created": "Creato",
              "Updated": "Aggiornato",
              "Key": "Chiave",
              "Learned association": "Associazione appresa",
              "Evidence details": "Dettagli delle evidenze",
              "View selected tool details…": "Mostra dettagli del tool selezionato…",
              "View selected association details…": "Mostra dettagli dell'associazione selezionata…",
              "Tool details · {name}": "Dettagli tool · {name}",
              "Learned association details": "Dettagli dell'associazione appresa",
          }
          for key, value in translations.items():
              if key in data:
                  data[key] = value
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m ruff format \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_integration.py \
            google_health_viewer/ai_chat.py \
            google_health_viewer/analysis.py \
            google_health_viewer/deterministic_context_patch.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_ui.py \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
          python -m ruff check --fix \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_integration.py \
            google_health_viewer/ai_chat.py \
            google_health_viewer/analysis.py \
            google_health_viewer/deterministic_context_patch.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_ui.py \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
      - name: Validate focused tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_integration.py \
            google_health_viewer/ai_chat.py \
            google_health_viewer/analysis.py \
            google_health_viewer/deterministic_context_patch.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_ui.py \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
          pytest -q \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            google_health_viewer/agent_runtime_v2.py \
            google_health_viewer/agent_integration.py \
            google_health_viewer/ai_chat.py \
            google_health_viewer/analysis.py \
            google_health_viewer/deterministic_context_patch.py \
            google_health_viewer/agent_tool_factory.py \
            google_health_viewer/agent_tools.py \
            google_health_viewer/agent_ui.py \
            google_health_viewer/locales/en.json \
            google_health_viewer/locales/it.json \
            tests/test_analysis.py \
            tests/test_agent_tool_factory_v2.py \
            tests/test_ai_chat.py \
            tests/test_agent_ui_details.py
          git commit -m 'Improve agent tool creation UX and sleep-stage routing'
          git push origin HEAD:fix/tool-factory-strict-gate
