name: Bug report
description: Report a reproducible VitalChronicle problem without personal health data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach OAuth credentials, tokens, databases, exported health archives, or
        screenshots containing personal health information.
  - type: input
    id: version
    attributes:
      label: VitalChronicle version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and package
      placeholder: Fedora 43 AppImage, Windows 11 executable, macOS arm64 DMG, source installation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
